<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1117;
            color: #f5f5f5;
            min-height: 100vh;
        }


        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }


        .header h1 {
            font-size: 32px;
        }


        .header p {
            color: #9ca3af;
            margin-top: 6px;
        }


        /* =========================
           NOTIFICATION AREA
        ========================= */

        .notification-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        #notificationStatus {
            color: #9ca3af;
            font-size: 13px;
        }


        .notification-btn {
            background: #2563eb;
            color: white;
        }


        .notification-btn:hover {
            background: #1d4ed8;
        }


        /* =========================
           STATISTICS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }


        .stat-card {
            background: #181b23;
            border: 1px solid #292d38;
            border-radius: 10px;
            padding: 20px;
        }


        .stat-card h3 {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 10px;
        }


        .stat-card strong {
            font-size: 28px;
        }


        /* =========================
           TASK FORM
        ========================= */

        .task-form {
            background: #181b23;
            border: 1px solid #292d38;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }


        .task-form h2 {
            margin-bottom: 20px;
        }


        .form-group {
            margin-bottom: 15px;
        }


        label {
            display: block;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 7px;
        }


        input,
        textarea,
        select {

            width: 100%;

            background: #10131a;

            border: 1px solid #303542;

            color: #f5f5f5;

            border-radius: 7px;

            padding: 12px;

            outline: none;

            font-size: 14px;
        }


        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
        }


        textarea {
            resize: vertical;
            min-height: 90px;
        }


        input[type="datetime-local"] {
            color-scheme: dark;
        }


        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }


        .add-btn {

            width: 100%;

            background: #2563eb;

            color: white;

            font-weight: bold;

            margin-top: 5px;
        }


        .add-btn:hover {
            background: #1d4ed8;
        }


        /* =========================
           TIMEZONE
        ========================= */

        .timezone-info {

            background: #13161d;

            border: 1px solid #292d38;

            border-radius: 7px;

            padding: 10px 12px;

            margin-top: 5px;

            margin-bottom: 15px;

            color: #9ca3af;

            font-size: 12px;
        }


        .timezone-info strong {
            color: #cbd5e1;
        }


        /* =========================
           FILTERS
        ========================= */

        .filter-bar {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }


        .filter-btn {

            background: #181b23;

            color: #cbd5e1;

            border: 1px solid #303542;
        }


        .filter-btn:hover {
            background: #222631;
        }


        .filter-btn.active {

            background: #2563eb;

            color: white;

            border-color: #2563eb;
        }


        /* =========================
           TASK LIST
        ========================= */

        #taskList {

            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        .task-card {

            background: #181b23;

            border: 1px solid #292d38;

            border-radius: 10px;

            padding: 20px;
        }


        .task-card.completed {
            opacity: 0.6;
        }


        .task-card.completed .task-title {

            text-decoration: line-through;

            color: #9ca3af;
        }


        .task-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;
        }


        .task-title {

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .task-description {

            color: #9ca3af;

            line-height: 1.5;

            margin-bottom: 15px;

            white-space: pre-wrap;
        }


        .task-meta {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 15px;
        }


        .badge {

            background: #222631;

            color: #cbd5e1;

            border-radius: 6px;

            padding: 6px 9px;

            font-size: 12px;
        }


        .badge.due {
            color: #60a5fa;
        }


        .badge.reminder {
            color: #fbbf24;
        }


        .badge.overdue {

            color: #f87171;

            background: #321d21;
        }


        .badge.done {

            color: #4ade80;

            background: #172b20;
        }


        .task-actions {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }


        button {

            border: none;

            cursor: pointer;

            border-radius: 7px;

            padding: 10px 15px;

            font-size: 14px;
        }


        .done-btn {

            background: #166534;

            color: white;
        }


        .edit-btn {

            background: #374151;

            color: white;
        }


        .delete-btn {

            background: #991b1b;

            color: white;
        }


        .done-btn:hover {
            background: #15803d;
        }


        .edit-btn:hover {
            background: #4b5563;
        }


        .delete-btn:hover {
            background: #b91c1c;
        }


        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {

            background: #181b23;

            border: 1px dashed #303542;

            border-radius: 10px;

            padding: 50px 20px;

            text-align: center;

            color: #9ca3af;
        }


        /* =========================
           ERROR
        ========================= */

        #errorMessage {

            display: none;

            background: #3b1d1d;

            color: #fca5a5;

            border: 1px solid #7f1d1d;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;
        }


        /* =========================
           EDIT MODAL
        ========================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.75);

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 1000;
        }


        .modal.show {
            display: flex;
        }


        .modal-content {

            width: 100%;

            max-width: 600px;

            background: #181b23;

            border: 1px solid #303542;

            border-radius: 10px;

            padding: 25px;
        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .modal-header h2 {
            font-size: 22px;
        }


        .close-btn {

            background: transparent;

            color: #9ca3af;

            font-size: 24px;

            padding: 2px 8px;
        }


        .close-btn:hover {
            color: white;
        }


        .modal-actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;
        }


        .cancel-btn {

            background: #374151;

            color: white;
        }


        .save-btn {

            background: #2563eb;

            color: white;
        }


        /* =========================
           C# STYLE TASK ALERT
        ========================= */

        .alert-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.72);

            justify-content: center;

            align-items: center;

            z-index: 2000;

            padding: 20px;
        }


        .alert-overlay.show {
            display: flex;
        }


        .alert-box {

            width: 100%;

            max-width: 420px;

            background: #1f232d;

            border: 1px solid #3b414f;

            border-radius: 8px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.6);

            overflow: hidden;

            animation: alertAppear 0.15s ease-out;
        }


        @keyframes alertAppear {

            from {

                opacity: 0;

                transform: scale(0.95);

            }

            to {

                opacity: 1;

                transform: scale(1);

            }
        }


        .alert-header {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 15px 18px;

            background: #252a35;

            border-bottom: 1px solid #3b414f;
        }


        .alert-icon {
            font-size: 22px;
        }


        .alert-title {

            font-size: 16px;

            font-weight: bold;
        }


        .alert-body {

            padding: 25px 20px;

            color: #f5f5f5;

            font-size: 16px;

            line-height: 1.5;

            word-break: break-word;
        }


        .alert-footer {

            display: flex;

            justify-content: flex-end;

            padding: 12px 15px;

            background: #181b23;

            border-top: 1px solid #303542;
        }


        .alert-ok-btn {

            min-width: 80px;

            background: #2563eb;

            color: white;
        }


        .alert-ok-btn:hover {
            background: #1d4ed8;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .header {

                flex-direction: column;

                align-items: flex-start;
            }
        }


        @media (max-width: 600px) {

            .container {

                width: 94%;

                margin: 25px auto;
            }


            .stats {

                grid-template-columns:
                    1fr 1fr;
            }


            .form-row {

                grid-template-columns: 1fr;
            }


            .task-top {

                flex-direction: column;
            }


            .task-actions {

                width: 100%;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <div>

            <h1>
                Task Manager
            </h1>

            <p>
                Manage your tasks, deadlines and reminders.
            </p>

        </div>


        <div class="notification-area">

            <span id="notificationStatus">
                Notifications not enabled
            </span>


            <button
                id="notificationButton"
                class="notification-btn"
                onclick="requestNotificationPermission()">

                Enable Notifications

            </button>

        </div>

    </div>


    <!-- =========================
         ERROR
    ========================= -->

    <div id="errorMessage"></div>


    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="stats">


        <div class="stat-card">

            <h3>
                Total Tasks
            </h3>

            <strong id="totalTasks">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                Pending
            </h3>

            <strong id="pendingTasks">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                Completed
            </h3>

            <strong id="completedTasks">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                Overdue
            </h3>

            <strong id="overdueTasks">
                0
            </strong>

        </div>


    </div>


    <!-- =========================
         ADD TASK
    ========================= -->

    <div class="task-form">


        <h2>
            Add New Task
        </h2>


        <form id="taskForm">


            <div class="form-group">

                <label for="title">
                    Task Title
                </label>


                <input
                    type="text"
                    id="title"
                    placeholder="Enter task title"
                    required>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>


                <textarea
                    id="description"
                    placeholder="Enter task description">
                </textarea>

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="dueDate">
                        Due Date & Time
                    </label>


                    <input
                        type="datetime-local"
                        id="dueDate"
                        required>

                </div>


                <div class="form-group">

                    <label for="reminder">
                        Reminder
                    </label>


                    <input
                        type="text"
                        id="reminder"
                        placeholder="Example: 30M, 2H, 1D">

                </div>


            </div>


            <div class="timezone-info">

                Browser/Desktop Timezone:

                <strong id="timezoneDisplay">
                    Detecting...
                </strong>

                <br>

                Task times and reminders use your
                computer's local time.

            </div>


            <button
                type="submit"
                class="add-btn">

                Add Task

            </button>


        </form>

    </div>


    <!-- =========================
         FILTERS
    ========================= -->

    <div class="filter-bar">


        <button
            class="filter-btn active"
            onclick="filterTasks('all', this)">

            All

        </button>


        <button
            class="filter-btn"
            onclick="filterTasks('pending', this)">

            Pending

        </button>


        <button
            class="filter-btn"
            onclick="filterTasks('completed', this)">

            Completed

        </button>


        <button
            class="filter-btn"
            onclick="filterTasks('overdue', this)">

            Overdue

        </button>


    </div>


    <!-- =========================
         TASK LIST
    ========================= -->

    <div id="taskList">

        <div class="empty-state">

            Loading tasks...

        </div>

    </div>


</div>


<!-- =========================
     EDIT MODAL
========================= -->

<div
    id="editModal"
    class="modal">


    <div class="modal-content">


        <div class="modal-header">

            <h2>
                Edit Task
            </h2>


            <button
                class="close-btn"
                onclick="closeEditModal()">

                ×

            </button>

        </div>


        <input
            type="hidden"
            id="editTaskId">


        <div class="form-group">

            <label for="editTitle">
                Task Title
            </label>


            <input
                type="text"
                id="editTitle"
                required>

        </div>


        <div class="form-group">

            <label for="editDescription">
                Description
            </label>


            <textarea
                id="editDescription">
            </textarea>

        </div>


        <div class="form-row">


            <div class="form-group">

                <label for="editDueDate">
                    Due Date & Time
                </label>


                <input
                    type="datetime-local"
                    id="editDueDate"
                    required>

            </div>


            <div class="form-group">

                <label for="editReminder">
                    Reminder
                </label>


                <input
                    type="text"
                    id="editReminder"
                    placeholder="Example: 30M, 2H, 1D">

            </div>


        </div>


        <div class="form-group">

            <label for="editStatus">
                Status
            </label>


            <select id="editStatus">

                <option value="pending">
                    Pending
                </option>

                <option value="done">
                    Completed
                </option>

            </select>

        </div>


        <div class="modal-actions">


            <button
                class="cancel-btn"
                onclick="closeEditModal()">

                Cancel

            </button>


            <button
                class="save-btn"
                onclick="saveEdit()">

                Save Changes

            </button>


        </div>


    </div>

</div>


<!-- =========================
     C# STYLE TASK ALERT
========================= -->

<div
    id="taskAlert"
    class="alert-overlay">


    <div class="alert-box">


        <div class="alert-header">


            <span class="alert-icon">
                ⏰
            </span>


            <span class="alert-title">
                Task Reminder
            </span>


        </div>


        <!--
            TASK NAME WILL APPEAR HERE
        -->

        <div
            id="alertTaskName"
            class="alert-body">
        </div>


        <div class="alert-footer">


            <button
                id="alertOkButton"
                class="alert-ok-btn"
                onclick="closeTaskAlert()">

                OK

            </button>


        </div>


    </div>

</div>


<script>


    /*
     * ==========================================
     * CONFIGURATION
     * ==========================================
     */

    const API_URL = "/tasks";


    /*
     * Browser/desktop timezone.
     *
     * Example:
     *
     * Asia/Kolkata
     * America/New_York
     * Europe/London
     */

    const USER_TIMEZONE =
        Intl.DateTimeFormat()
            .resolvedOptions()
            .timeZone;


    /*
     * ==========================================
     * GLOBAL VARIABLES
     * ==========================================
     */

    let tasks = [];

    let currentFilter = "all";


    /*
     * Prevent duplicate reminders.
     */

    const triggeredReminders =
        new Set();


    /*
     * ==========================================
     * INITIALIZATION
     * ==========================================
     */

    document.addEventListener(
        "DOMContentLoaded",
        () => {


            document
                .getElementById(
                    "timezoneDisplay"
                )
                .textContent =
                USER_TIMEZONE ||
                "Local browser timezone";


            updateNotificationStatus();


            loadTasks();


            /*
             * Check reminders every 10 seconds.
             */

            setInterval(
                checkReminders,
                10000
            );


            /*
             * Refresh tasks from MongoDB
             * every 30 seconds.
             */

            setInterval(
                loadTasks,
                30000
            );

        }
    );


    /*
     * ==========================================
     * ERROR MESSAGE
     * ==========================================
     */

    function showError(message) {


        const errorElement =
            document.getElementById(
                "errorMessage"
            );


        errorElement.textContent =
            message;


        errorElement.style.display =
            "block";


        setTimeout(
            () => {

                errorElement.style.display =
                    "none";

            },
            5000
        );

    }


    /*
     * ==========================================
     * NOTIFICATION PERMISSION
     * ==========================================
     */

    async function requestNotificationPermission() {


        if (
            !("Notification" in window)
        ) {

            showError(
                "Browser notifications are not supported."
            );

            return;
        }


        try {


            const permission =
                await Notification
                    .requestPermission();


            updateNotificationStatus();


            if (
                permission === "granted"
            ) {

                console.log(
                    "Notifications enabled."
                );

            }


        } catch (error) {

            console.error(error);

            showError(
                "Unable to enable notifications."
            );

        }

    }


    function updateNotificationStatus() {


        const status =
            document.getElementById(
                "notificationStatus"
            );


        const button =
            document.getElementById(
                "notificationButton"
            );


        if (
            !("Notification" in window)
        ) {

            status.textContent =
                "Notifications unavailable";

            button.style.display =
                "none";

            return;
        }


        if (
            Notification.permission ===
            "granted"
        ) {


            status.textContent =
                "Notifications enabled";


            button.textContent =
                "Notifications Enabled";


            button.disabled =
                true;


            button.style.opacity =
                "0.6";


        } else if (
            Notification.permission ===
            "denied"
        ) {


            status.textContent =
                "Notifications blocked";


            button.textContent =
                "Notifications Blocked";


            button.disabled =
                true;


        } else {


            status.textContent =
                "Notifications not enabled";


            button.textContent =
                "Enable Notifications";


            button.disabled =
                false;

        }

    }


    /*
     * ==========================================
     * LOAD TASKS
     * ==========================================
     */

    async function loadTasks() {


        try {


            const response =
                await fetch(API_URL);


            if (!response.ok) {

                throw new Error(
                    "Failed to load tasks."
                );

            }


            tasks =
                await response.json();


            renderTasks();


            updateStatistics();


            /*
             * Check reminders immediately.
             */

            checkReminders();


        } catch (error) {


            console.error(error);


            showError(
                "Unable to load tasks. Make sure Flask is running."
            );

        }

    }


    /*
     * ==========================================
     * ADD TASK
     * ==========================================
     */

    document
        .getElementById("taskForm")
        .addEventListener(
            "submit",
            async function(event) {


                event.preventDefault();


                const title =
                    document
                        .getElementById(
                            "title"
                        )
                        .value
                        .trim();


                const description =
                    document
                        .getElementById(
                            "description"
                        )
                        .value
                        .trim();


                const dueDate =
                    document
                        .getElementById(
                            "dueDate"
                        )
                        .value;


                const reminder =
                    document
                        .getElementById(
                            "reminder"
                        )
                        .value
                        .trim();


                if (!title) {

                    showError(
                        "Please enter a task title."
                    );

                    return;
                }


                if (!dueDate) {

                    showError(
                        "Please select a due date and time."
                    );

                    return;
                }


                if (
                    reminder &&
                    !parseReminder(reminder)
                ) {

                    showError(
                        "Invalid reminder format. Use 30M, 2H or 1D."
                    );

                    return;
                }


                try {


                    const response =
                        await fetch(
                            API_URL,
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        title:
                                            title,

                                        description:
                                            description,

                                        dueDate:
                                            dueDate,

                                        reminder:
                                            reminder,

                                        status:
                                            "pending"

                                    })

                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Failed to create task."
                        );

                    }


                    document
                        .getElementById(
                            "taskForm"
                        )
                        .reset();


                    await loadTasks();


                } catch (error) {


                    console.error(error);


                    showError(
                        "Unable to create task."
                    );

                }

            }
        );


    /*
     * ==========================================
     * RENDER TASKS
     * ==========================================
     */

    function renderTasks() {


        const taskList =
            document.getElementById(
                "taskList"
            );


        let filteredTasks =
            tasks.filter(
                task => {


                    if (
                        currentFilter ===
                        "all"
                    ) {

                        return true;
                    }


                    if (
                        currentFilter ===
                        "pending"
                    ) {

                        return (
                            task.status !==
                            "done"
                        );

                    }


                    if (
                        currentFilter ===
                        "completed"
                    ) {

                        return (
                            task.status ===
                            "done"
                        );

                    }


                    if (
                        currentFilter ===
                        "overdue"
                    ) {

                        return isOverdue(task);

                    }


                    return true;

                }
            );


        filteredTasks.sort(
            (a, b) => {


                if (!a.dueDate) {
                    return 1;
                }


                if (!b.dueDate) {
                    return -1;
                }


                return (
                    parseLocalDateTime(
                        a.dueDate
                    ) -
                    parseLocalDateTime(
                        b.dueDate
                    )
                );

            }
        );


        if (
            filteredTasks.length === 0
        ) {


            taskList.innerHTML = `

                <div class="empty-state">
                    No tasks found.
                </div>

            `;


            return;
        }


        taskList.innerHTML =
            filteredTasks
                .map(
                    task => {


                        const overdue =
                            isOverdue(task);


                        const completed =
                            task.status ===
                            "done";


                        return `

                            <div class="task-card
                                ${
                                    completed
                                        ? "completed"
                                        : ""
                                }">

                                <div class="task-top">


                                    <div
                                        style="flex: 1;">


                                        <div
                                            class="task-title">

                                            ${
                                                escapeHtml(
                                                    task.title ||
                                                    "Untitled Task"
                                                )
                                            }

                                        </div>


                                        ${
                                            task.description
                                                ?
                                                `
                                                <div
                                                    class="task-description">

                                                    ${
                                                        escapeHtml(
                                                            task.description
                                                        )
                                                    }

                                                </div>
                                                `
                                                :
                                                ""
                                        }


                                        <div
                                            class="task-meta">


                                            ${
                                                task.dueDate
                                                    ?
                                                    `
                                                    <span
                                                        class="badge due">

                                                        📅
                                                        ${
                                                            formatDateTime(
                                                                task.dueDate
                                                            )
                                                        }

                                                    </span>
                                                    `
                                                    :
                                                    ""
                                            }


                                            ${
                                                task.reminder
                                                    ?
                                                    `
                                                    <span
                                                        class="badge reminder">

                                                        ⏰ Reminder:
                                                        ${
                                                            escapeHtml(
                                                                task.reminder
                                                            )
                                                        }

                                                    </span>
                                                    `
                                                    :
                                                    ""
                                            }


                                            ${
                                                overdue &&
                                                !completed
                                                    ?
                                                    `
                                                    <span
                                                        class="badge overdue">

                                                        ⚠ Overdue

                                                    </span>
                                                    `
                                                    :
                                                    ""
                                            }


                                            ${
                                                completed
                                                    ?
                                                    `
                                                    <span
                                                        class="badge done">

                                                        ✓ Completed

                                                    </span>
                                                    `
                                                    :
                                                    ""
                                            }


                                        </div>


                                    </div>


                                    <div
                                        class="task-actions">


                                        ${
                                            !completed
                                                ?
                                                `
                                                <button
                                                    class="done-btn"
                                                    onclick="completeTask(
                                                        '${task.id}'
                                                    )">

                                                    ✓ Done

                                                </button>
                                                `
                                                :
                                                ""
                                        }


                                        <button
                                            class="edit-btn"
                                            onclick="openEditModal(
                                                '${task.id}'
                                            )">

                                            Edit

                                        </button>


                                        <button
                                            class="delete-btn"
                                            onclick="deleteTask(
                                                '${task.id}'
                                            )">

                                            Delete

                                        </button>


                                    </div>


                                </div>


                            </div>

                        `;

                    }
                )
                .join("");

    }


    /*
     * ==========================================
     * COMPLETE TASK
     * ==========================================
     */

    async function completeTask(id) {


        const task =
            tasks.find(
                t => t.id === id
            );


        if (!task) {
            return;
        }


        try {


            const response =
                await fetch(
                    `${API_URL}/${id}`,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                title:
                                    task.title,

                                description:
                                    task.description,

                                dueDate:
                                    task.dueDate,

                                reminder:
                                    task.reminder,

                                status:
                                    "done"

                            })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to complete task."
                );

            }


            removeTaskReminders(id);


            await loadTasks();


        } catch (error) {


            console.error(error);


            showError(
                "Unable to complete task."
            );

        }

    }


    /*
     * ==========================================
     * DELETE TASK
     * ==========================================
     */

    async function deleteTask(id) {


        if (
            !confirm(
                "Are you sure you want to delete this task?"
            )
        ) {

            return;
        }


        try {


            const response =
                await fetch(
                    `${API_URL}/${id}`,
                    {

                        method: "DELETE"

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to delete task."
                );

            }


            removeTaskReminders(id);


            await loadTasks();


        } catch (error) {


            console.error(error);


            showError(
                "Unable to delete task."
            );

        }

    }


    /*
     * ==========================================
     * OPEN EDIT MODAL
     * ==========================================
     */

    function openEditModal(id) {


        const task =
            tasks.find(
                t => t.id === id
            );


        if (!task) {
            return;
        }


        document
            .getElementById(
                "editTaskId"
            )
            .value =
            task.id;


        document
            .getElementById(
                "editTitle"
            )
            .value =
            task.title || "";


        document
            .getElementById(
                "editDescription"
            )
            .value =
            task.description || "";


        document
            .getElementById(
                "editDueDate"
            )
            .value =
            convertToDateTimeLocal(
                task.dueDate
            );


        document
            .getElementById(
                "editReminder"
            )
            .value =
            task.reminder || "";


        document
            .getElementById(
                "editStatus"
            )
            .value =
            task.status || "pending";


        document
            .getElementById(
                "editModal"
            )
            .classList
            .add("show");

    }


    /*
     * ==========================================
     * SAVE EDIT
     * ==========================================
     */

    async function saveEdit() {


        const id =
            document
                .getElementById(
                    "editTaskId"
                )
                .value;


        const title =
            document
                .getElementById(
                    "editTitle"
                )
                .value
                .trim();


        const description =
            document
                .getElementById(
                    "editDescription"
                )
                .value
                .trim();


        const dueDate =
            document
                .getElementById(
                    "editDueDate"
                )
                .value;


        const reminder =
            document
                .getElementById(
                    "editReminder"
                )
                .value
                .trim();


        const status =
            document
                .getElementById(
                    "editStatus"
                )
                .value;


        if (!title) {

            showError(
                "Please enter a task title."
            );

            return;
        }


        if (!dueDate) {

            showError(
                "Please select a due date and time."
            );

            return;
        }


        if (
            reminder &&
            !parseReminder(reminder)
        ) {

            showError(
                "Invalid reminder format. Use 30M, 2H or 1D."
            );

            return;
        }


        try {


            const response =
                await fetch(
                    `${API_URL}/${id}`,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                title:
                                    title,

                                description:
                                    description,

                                dueDate:
                                    dueDate,

                                reminder:
                                    reminder,

                                status:
                                    status

                            })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to update task."
                );

            }


            removeTaskReminders(id);


            closeEditModal();


            await loadTasks();


        } catch (error) {


            console.error(error);


            showError(
                "Unable to update task."
            );

        }

    }


    /*
     * ==========================================
     * CLOSE EDIT MODAL
     * ==========================================
     */

    function closeEditModal() {


        document
            .getElementById(
                "editModal"
            )
            .classList
            .remove("show");

    }


    /*
     * ==========================================
     * FILTER TASKS
     * ==========================================
     */

    function filterTasks(
        filter,
        button
    ) {


        currentFilter =
            filter;


        document
            .querySelectorAll(
                ".filter-btn"
            )
            .forEach(
                btn => {

                    btn.classList
                        .remove(
                            "active"
                        );

                }
            );


        button.classList
            .add("active");


        renderTasks();

    }


    /*
     * ==========================================
     * STATISTICS
     * ==========================================
     */

    function updateStatistics() {


        const total =
            tasks.length;


        const completed =
            tasks.filter(
                task =>
                    task.status ===
                    "done"
            ).length;


        const pending =
            tasks.filter(
                task =>
                    task.status !==
                    "done"
            ).length;


        const overdue =
            tasks.filter(
                task =>
                    isOverdue(task)
            ).length;


        document
            .getElementById(
                "totalTasks"
            )
            .textContent =
            total;


        document
            .getElementById(
                "pendingTasks"
            )
            .textContent =
            pending;


        document
            .getElementById(
                "completedTasks"
            )
            .textContent =
            completed;


        document
            .getElementById(
                "overdueTasks"
            )
            .textContent =
            overdue;

    }


    /*
     * ==========================================
     * OVERDUE
     * ==========================================
     */

    function isOverdue(task) {


        if (!task.dueDate) {
            return false;
        }


        if (
            task.status ===
            "done"
        ) {

            return false;
        }


        const dueDate =
            parseLocalDateTime(
                task.dueDate
            );


        if (!dueDate) {
            return false;
        }


        return (
            new Date() >
            dueDate
        );

    }


    /*
     * ==========================================
     * PARSE LOCAL DATE/TIME
     * ==========================================
     */

    function parseLocalDateTime(
        dateTimeString
    ) {


        if (!dateTimeString) {
            return null;
        }


        const parts =
            dateTimeString
                .split("T");


        if (
            parts.length !== 2
        ) {

            return null;
        }


        const dateValues =
            parts[0]
                .split("-")
                .map(Number);


        const timeValues =
            parts[1]
                .split(":")
                .map(Number);


        if (
            dateValues.length !== 3 ||
            timeValues.length < 2
        ) {

            return null;
        }


        /*
         * IMPORTANT:
         *
         * new Date(...)
         * uses the desktop's local timezone.
         */

        return new Date(

            dateValues[0],

            dateValues[1] - 1,

            dateValues[2],

            timeValues[0],

            timeValues[1],

            0

        );

    }


    /*
     * ==========================================
     * PARSE REMINDER
     * ==========================================
     *
     * 30M = 30 minutes
     * 2H  = 2 hours
     * 1D  = 1 day
     */

    function parseReminder(
        reminder
    ) {


        if (!reminder) {
            return null;
        }


        const match =
            reminder
                .trim()
                .toUpperCase()
                .match(
                    /^(\d+)\s*(M|H|D)$/
                );


        if (!match) {
            return null;
        }


        const value =
            parseInt(
                match[1],
                10
            );


        const unit =
            match[2];


        if (unit === "M") {

            return (
                value *
                60 *
                1000
            );
        }


        if (unit === "H") {

            return (
                value *
                60 *
                60 *
                1000
            );
        }


        if (unit === "D") {

            return (
                value *
                24 *
                60 *
                60 *
                1000
            );
        }


        return null;

    }


    /*
     * ==========================================
     * CALCULATE REMINDER TIME
     * ==========================================
     */

    function getReminderTime(
        task
    ) {


        if (
            !task.dueDate ||
            !task.reminder
        ) {

            return null;
        }


        const dueDate =
            parseLocalDateTime(
                task.dueDate
            );


        if (!dueDate) {
            return null;
        }


        const duration =
            parseReminder(
                task.reminder
            );


        if (
            duration === null
        ) {

            return null;
        }


        return new Date(
            dueDate.getTime() -
            duration
        );

    }


    /*
     * ==========================================
     * CHECK REMINDERS
     * ==========================================
     */

    function checkReminders() {


        const now =
            new Date();


        tasks.forEach(
            task => {


                /*
                 * Don't alert completed tasks.
                 */

                if (
                    task.status ===
                    "done"
                ) {

                    return;
                }


                const reminderTime =
                    getReminderTime(
                        task
                    );


                if (!reminderTime) {
                    return;
                }


                /*
                 * Unique identifier.
                 */

                const reminderKey =
                    `${task.id}-${reminderTime.getTime()}`;


                /*
                 * Already displayed.
                 */

                if (
                    triggeredReminders
                        .has(
                            reminderKey
                        )
                ) {

                    return;
                }


                /*
                 * Reminder time has arrived.
                 */

                if (
                    now >=
                    reminderTime
                ) {


                    const difference =
                        now.getTime() -
                        reminderTime.getTime();


                    /*
                     * Only trigger within
                     * one minute of the
                     * reminder time.
                     */

                    if (
                        difference <=
                        60 * 1000
                    ) {

                        sendTaskAlert(
                            task
                        );

                    }


                    triggeredReminders
                        .add(
                            reminderKey
                        );

                }

            }
        );

    }


    /*
     * ==========================================
     * PLAY REMINDER SOUND
     * ==========================================
     *
     * No external audio file required.
     *
     * The browser generates a short
     * two-tone notification sound.
     */

    function playReminderSound() {


        try {


            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContext) {

                return;
            }


            const audioContext =
                new AudioContext();


            /*
             * First tone.
             */

            const oscillator1 =
                audioContext
                    .createOscillator();


            const gain1 =
                audioContext
                    .createGain();


            oscillator1.type =
                "sine";


            oscillator1.frequency.value =
                880;


            gain1.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime
            );


            gain1.gain.exponentialRampToValueAtTime(
                0.35,
                audioContext.currentTime + 0.02
            );


            gain1.gain.exponentialRampToValueAtTime(
                0.0001,
                audioContext.currentTime + 0.35
            );


            oscillator1.connect(
                gain1
            );


            gain1.connect(
                audioContext.destination
            );


            oscillator1.start();


            oscillator1.stop(
                audioContext.currentTime +
                0.35
            );


            /*
             * Second tone.
             */

            const oscillator2 =
                audioContext
                    .createOscillator();


            const gain2 =
                audioContext
                    .createGain();


            oscillator2.type =
                "sine";


            oscillator2.frequency.value =
                660;


            gain2.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime +
                0.35
            );


            gain2.gain.exponentialRampToValueAtTime(
                0.35,
                audioContext.currentTime +
                0.38
            );


            gain2.gain.exponentialRampToValueAtTime(
                0.0001,
                audioContext.currentTime +
                0.75
            );


            oscillator2.connect(
                gain2
            );


            gain2.connect(
                audioContext.destination
            );


            oscillator2.start(
                audioContext.currentTime +
                0.35
            );


            oscillator2.stop(
                audioContext.currentTime +
                0.75
            );


            /*
             * Close audio context after
             * the sound finishes.
             */

            setTimeout(
                () => {

                    audioContext.close();

                },
                1000
            );


        } catch (error) {

            console.error(
                "Unable to play reminder sound:",
                error
            );

        }

    }


    /*
     * ==========================================
     * SHOW TASK ALERT
     * ==========================================
     */

    function sendTaskAlert(
        task
    ) {


        /*
         * Play audio first.
         */

        playReminderSound();


        /*
         * Put task name in alert body.
         */

        const alertTaskName =
            document.getElementById(
                "alertTaskName"
            );


        alertTaskName.textContent =
            task.title ||
            "Task Reminder";


        /*
         * Show alert.
         */

        const alert =
            document.getElementById(
                "taskAlert"
            );


        alert.classList.add(
            "show"
        );


        /*
         * Focus OK button.
         */

        document
            .getElementById(
                "alertOkButton"
            )
            .focus();

    }


    /*
     * ==========================================
     * CLOSE TASK ALERT
     * ==========================================
     */

    function closeTaskAlert() {


        document
            .getElementById(
                "taskAlert"
            )
            .classList
            .remove("show");

    }


    /*
     * ==========================================
     * REMOVE TASK REMINDERS
     * ==========================================
     */

    function removeTaskReminders(
        id
    ) {


        for (
            const key
            of triggeredReminders
        ) {


            if (
                key.startsWith(
                    `${id}-`
                )
            ) {

                triggeredReminders
                    .delete(key);

            }

        }

    }


    /*
     * ==========================================
     * FORMAT DATE/TIME
     * ==========================================
     */

    function formatDateTime(
        dateTimeString
    ) {


        if (!dateTimeString) {

            return "No deadline";
        }


        const date =
            parseLocalDateTime(
                dateTimeString
            );


        if (
            !date ||
            isNaN(date.getTime())
        ) {

            return "Invalid date";
        }


        return date.toLocaleString(
            undefined,
            {

                year: "numeric",

                month: "short",

                day: "numeric",

                hour: "numeric",

                minute: "2-digit"

            }
        );

    }


    /*
     * ==========================================
     * CONVERT TO DATETIME-LOCAL
     * ==========================================
     */

    function convertToDateTimeLocal(
        dateTimeString
    ) {


        if (!dateTimeString) {
            return "";
        }


        /*
         * Backend format:
         *
         * 2026-09-15T18:30
         */

        if (
            dateTimeString.length >= 16 &&
            dateTimeString[10] === "T"
        ) {

            return dateTimeString
                .substring(0, 16);
        }


        const date =
            new Date(
                dateTimeString
            );


        if (
            isNaN(
                date.getTime()
            )
        ) {

            return "";
        }


        const year =
            date.getFullYear();


        const month =
            String(
                date.getMonth() + 1
            )
            .padStart(2, "0");


        const day =
            String(
                date.getDate()
            )
            .padStart(2, "0");


        const hours =
            String(
                date.getHours()
            )
            .padStart(2, "0");


        const minutes =
            String(
                date.getMinutes()
            )
            .padStart(2, "0");


        return (
            `${year}-${month}-${day}` +
            `T${hours}:${minutes}`
        );

    }


    /*
     * ==========================================
     * ESCAPE HTML
     * ==========================================
     */

    function escapeHtml(
        value
    ) {


        if (
            value === null ||
            value === undefined
        ) {

            return "";
        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /*
     * ==========================================
     * EDIT MODAL OUTSIDE CLICK
     * ==========================================
     */

    document
        .getElementById(
            "editModal"
        )
        .addEventListener(
            "click",
            function(event) {


                if (
                    event.target ===
                    this
                ) {

                    closeEditModal();

                }

            }
        );


    /*
     * ==========================================
     * KEYBOARD CONTROL
     * ==========================================
     *
     * ENTER or ESC closes the alert.
     */

    document.addEventListener(
        "keydown",
        function(event) {


            const alert =
                document.getElementById(
                    "taskAlert"
                );


            if (
                alert.classList.contains(
                    "show"
                )
            ) {


                if (
                    event.key ===
                    "Enter"
                ) {

                    closeTaskAlert();

                }


                if (
                    event.key ===
                    "Escape"
                ) {

                    closeTaskAlert();

                }

            }

        }
    );


</script>
